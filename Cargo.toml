[workspace]
# Vendored backend trees carry their own crates/workspaces — keep them out of
# this workspace; they are reached only via bench's `../<sys>` path-deps.
exclude = ["nomt", "reth", "lvmt", "eth-replay-kv"]
resolver = "2"
members = [
    "crates/hpfile",
    "crates/qmdb",
    "crates/qmdb-common",
    "bench",
]

[workspace.dependencies]
# Crypto
aead = "0.5.2"
aes-gcm = "0.10.3"
blake2 = { version = "0.10.6", default-features = false }
blake3 = { version = "1.8.2", default-features = false }

# Serialization
bincode = "1.3.3"
borsh = { version = "1.5", features = ["derive"] }
bytemuck = { version = "1.23.1", features = ["derive"] }
byteorder = "1.5.0"
bytes = { version = "1.10.1", default-features = false }
serde = { version = "1.0.219", default-features = false }
serde_json = { version = "1.0.139", default-features = false }

# Data structures
atomptr = "1.4.1"
dashmap = "6.1.0"
hashbrown = { version = "0.15.4" }
smallvec = { version = "1.15", features = ["const_generics"] }

# Concurrency
crossbeam = "0.8"
parking_lot = "0.12.3"
rayon = "1.10.0"
threadpool = "1.8.1"

# Error handling
anyhow = "1.0.96"
thiserror = { version = "2.0.12" }

# Utilities
arc-swap = "1.7.1"
auto_impl = { version = "1.3.0" }
cfg-if = { version = "1.0.0" }
chrono = "0.4"
clap = "4.5"
generic-array = "=1.1.0"
hex = "0.4.3"
itertools = "0.12"
lazy_static = "1.5.0"
log = "0.4"
once_cell = { version = "1.21.3", default-features = false }
portable-atomic = { version = "1.11.0", default-features = false }
rs_merkle = "1.5"
strum = { version = "0.27", default-features = false }
time = "0.3.37"
xxhash-rust = "0.8.15"

# System
libc = "0.2.170"
notify = "8.2.0"

# Storage backends
reth-libmdbx = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.1.2" }
rocksdb = "0.22.0"

# Linux-specific
io-uring = "0.7.2"
tikv-jemallocator = "0.6"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }

# Testing & benchmarking
criterion = "0.5"
memory-stats = "1.2.0"
serial_test = "3.2.0"
tempfile = "3.17.1"

# Workspace crates
hpfile = { path = "crates/hpfile" }
qmdb = { path = "crates/qmdb", default-features = false }
qmdb-common = { path = "crates/qmdb-common", default-features = false }

[workspace.package]
license = "MIT"
keywords = ["database", "merkle", "blockchain", "storage"]
repository = "https://github.com/LayerResearch/qmdb"
documentation = "https://github.com/LayerResearch/qmdb"
homepage = ""
edition = "2021"

[workspace.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[workspace.lints.rust]

[workspace.lints.clippy]

[profile.release]
codegen-units = 16
debug = "line-tables-only"
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

# Use the `--profile profiling` flag to show symbols in release mode.
# e.g. `cargo build --profile profiling`
[profile.profiling]
debug = 2
inherits = "release"
strip = false
incremental = true

# Make sure debug symbols are in the bench profile
[profile.bench]
inherits = "profiling"

# For faster development
[profile.release-incremental]
inherits = "release"
incremental = true

[profile.ethtests]
inherits = "test"
opt-level = 3



